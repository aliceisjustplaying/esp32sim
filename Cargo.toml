[workspace]
resolver = "2"
members = ["xtensa-lx7", "esp32s3", "cli", "wasm", "riscv-rv32", "esp32c3", "cli-c3"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
debug = 1
lto = "fat"
codegen-units = 1
overflow-checks = true
debug-assertions = true
