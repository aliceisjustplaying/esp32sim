name: pages
# Build the WebAssembly emulator and publish web/ to GitHub Pages: the emulator, the public demo
# firmware under web/wasm/fw/public, and the ESP32-S3 mask ROM ELF (Apache-2.0, espressif/esp-rom-elfs).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
env:
  RUST_TOOLCHAIN: "1.98.0"
  ROM_ARCHIVE_URL: https://github.com/espressif/esp-rom-elfs/releases/download/20241011/esp-rom-elfs-20241011.tar.gz
  ROM_ARCHIVE_SHA256: 921f000164a421c7628fbfee55b173384aafaa51883adc65cd27bf9b0af9e9a9
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action, pinned
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build the wasm module
        run: tools/wasm-build.sh
      - name: Fetch the ESP32-S3 and ESP32-C3 mask ROM ELFs
        run: |
          set -euo pipefail
          curl -fsSL "$ROM_ARCHIVE_URL" -o rom.tar.gz
          echo "$ROM_ARCHIVE_SHA256  rom.tar.gz" | sha256sum --check --strict
          tar -xzf rom.tar.gz --wildcards '*esp32s3_rev0_rom.elf' '*esp32c3_rev3_rom.elf'
          find . -name esp32s3_rev0_rom.elf -exec cp {} web/wasm/fw/ \;
          find . -name esp32c3_rev3_rom.elf -exec cp {} web/wasm/fw/ \;
          ls -la web/wasm/fw/esp32s3_rev0_rom.elf web/wasm/fw/esp32c3_rev3_rom.elf
      - name: Version-stamp the script and module URLs (Pages caches for 10 minutes)
        run: |
          v=${GITHUB_SHA::8}
          sed -i "s|src=\"emu.js\"|src=\"emu.js?v=$v\"|" web/index.html
          sed -i "s|new Worker('wasm/worker.js')|new Worker('wasm/worker.js?v=$v')|; s|fetch('wasm/esp32sim.wasm')|fetch('wasm/esp32sim.wasm?v=$v')|" web/emu.js
          grep -c "v=$v" web/index.html web/emu.js
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
