name: pages
# Build the WebAssembly emulator and publish web/ to GitHub Pages: the emulator, the public demo
# firmware under web/wasm/fw/public, and what tools/fetch-demo-assets.sh fetches, the same files a
# local checkout needs: the mask ROM ELFs (Apache-2.0, espressif/esp-rom-elfs), xterm.js for the
# Terminal tab (MIT, pinned by version and hash) and the Linux-on-esp32-S3 flash image (GPL-3.0,
# svermigo/Linux-on-esp32-S3, pinned by commit and hash).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the wasm module
        run: tools/wasm-build.sh
      - name: Fetch the demo assets (mask ROM ELFs, xterm.js, the Linux-on-esp32-S3 image)
        run: tools/fetch-demo-assets.sh
      # pocket-tank's firmware comes from its author's installer site, pinned by hash: if that host
      # is down or the bytes change, publish the rest and let that one demo report the missing file.
      - name: Fetch pocket-tank (MIT, mediacutlet/pocket-tank, pinned by SHA-256)
        continue-on-error: true
        run: |
          tools/fetch-pocket-tank.sh
          rm -f web/wasm/fw/local/pocket-tank-assets.json
      - name: Version-stamp the script and module URLs (Pages caches for 10 minutes)
        run: |
          v=${GITHUB_SHA::8}
          sed -i "s|src=\"emu.js\"|src=\"emu.js?v=$v\"|" web/index.html
          sed -i "s|new Worker('wasm/worker.js')|new Worker('wasm/worker.js?v=$v')|; s|fetch('wasm/esp32sim.wasm')|fetch('wasm/esp32sim.wasm?v=$v')|" web/emu.js
          grep -c "v=$v" web/index.html web/emu.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
