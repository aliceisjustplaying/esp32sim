name: Right button cycles waveform and plays the A4/C5 blip
version: 1
author: atech-sim
steps:
  - wait-serial: "FreeRTOS tasks started!"
  - delay: 300ms
  - set-control: { part-id: btn2, control: pressed, value: 1 }
  - wait-serial: '"key":"waveform","value":"TRIANGLE"'
  - wait-serial: "SIM:AUDIO:note=A4"
  - wait-serial: "SIM:AUDIO:note=C5"
  - set-control: { part-id: btn2, control: pressed, value: 0 }
  - delay: 300ms
  - take-screenshot: { part-id: tft, save-to: ../sim/screenshots/03-waveform-tft.png }
