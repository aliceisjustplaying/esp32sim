<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Atech virtual board</title>
<style>
  :root { --bg:#14161a; --panel:#1f2329; --fg:#e6e6e6; --dim:#8a919a; --acc:#38bdf8; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; gap:16px; align-items:center; padding:10px 16px; border-bottom:1px solid #2a2f36; }
  header h1 { font-size:15px; margin:0; font-weight:600; } header .st { color:var(--dim); }
  main { display:grid; grid-template-columns: 560px 1fr; gap:16px; padding:16px; }
  .board { background:var(--panel); border-radius:14px; padding:18px; display:grid; grid-template-columns:1fr 1fr; gap:18px; align-content:start; }
  .tft { grid-column:1 / span 2; justify-self:center; background:#000; padding:8px; border-radius:8px; border:3px solid #2b2f36; }
  canvas#tft { width:480px; height:240px; image-rendering:pixelated; display:block; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .lbl { color:var(--dim); font-size:12px; }
  .knobwrap { position:relative; width:150px; height:150px; }
  canvas#ring { position:absolute; inset:0; }
  .knob { position:absolute; left:35px; top:35px; width:80px; height:80px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #666, #222); border:2px solid #111; cursor:grab; user-select:none; }
  .knob:active { cursor:grabbing; }
  .knob .mark { position:absolute; left:50%; top:6px; width:4px; height:16px; margin-left:-2px; background:#ddd; border-radius:2px; transform-origin:2px 34px; }
  .kbtns { display:flex; gap:6px; }
  button { background:#2c313a; color:var(--fg); border:1px solid #3a404a; border-radius:8px; padding:6px 12px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  .push { width:64px; height:64px; border-radius:50%; font-weight:700; border:3px solid #333; box-shadow: inset 0 -4px 0 rgba(0,0,0,.4); }
  .push.g { background:#2e7d32; } .push.b { background:#1565c0; } .push:active, .push.down { transform:translateY(3px); box-shadow:none; }
  .btnrow { grid-column:1 / span 2; display:flex; justify-content:space-around; }
  .right { display:flex; flex-direction:column; gap:12px; min-width:0; }
  #console { background:#0b0d10; border:1px solid #2a2f36; border-radius:8px; height:380px; overflow:auto; padding:8px; font:12px/1.35 ui-monospace, Menlo, monospace; white-space:pre-wrap; word-break:break-all; }
  #console .sim { color:#f59e0b; } #console .evt { color:#34d399; } #console .in { color:var(--acc); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input[type=text] { flex:1; min-width:240px; background:#0b0d10; color:var(--fg); border:1px solid #2a2f36; border-radius:8px; padding:7px 10px; font-family:ui-monospace, Menlo, monospace; }
  .chip { font-size:12px; padding:4px 10px; }
  #audioBtn.on { border-color:#34d399; color:#34d399; }
  meter { width:120px; }
</style></head>
<body>
<header><h1>Atech virtual board — ESP32-S3 14-port</h1><span class="st" id="status">connecting…</span>
  <span style="flex:1"></span><button id="audioBtn">🔇 enable audio</button><meter id="vu" min="0" max="1" value="0"></meter></header>
<main>
  <section class="board">
    <div class="tft"><canvas id="tft" width="160" height="80"></canvas></div>
    <div class="cell"><div class="knobwrap"><canvas id="ring" width="150" height="150"></canvas><div class="knob" id="knob"><div class="mark"></div></div></div>
      <div class="kbtns"><button data-d="-1">⟲ CCW</button><button id="knobpress">press</button><button data-d="1">CW ⟳</button></div>
      <div class="lbl">rotary encoder + 12-LED ring (ports 1+2) — wheel/drag to turn, ←/→ keys</div></div>
    <div class="cell" id="buttons"><div class="lbl">buttons</div></div>
  </section>
  <section class="right">
    <div class="row"><strong>Serial console</strong><span class="lbl">USB-CDC · SDK envelope · <span class="sim">SIM:</span> lines are the simulator</span><span style="flex:1"></span><button class="chip" id="clear">clear</button></div>
    <div id="console"></div>
    <div class="row"><input type="text" id="line" placeholder='{"action":"set_note","value":"5"}' /><button id="send">send</button></div>
    <div class="row" id="presets"><span class="lbl">actions:</span></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const con = $('#console'), tft = $('#tft').getContext('2d'), ringC = $('#ring').getContext('2d');
let ws, ring = {r:0,g:0,b:0,bright:50,pos:0,enabled:true,leds:12}, knobAngle = 0;
let audioCtx = null, playHead = 0, rate = 44100;

function log(text, cls) {
  const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = text;
  con.appendChild(d); while (con.childElementCount > 600) con.removeChild(con.firstChild); con.scrollTop = con.scrollHeight;
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function drawFrame(buf) {
  const dv = new DataView(buf); const w = dv.getUint16(1, true), h = dv.getUint16(3, true);
  const img = tft.createImageData(w, h); const px = img.data;
  for (let i = 0; i < w * h; i++) {
    const p = dv.getUint16(5 + i * 2, true);
    px[i*4] = (p >> 11) * 255 / 31; px[i*4+1] = ((p >> 5) & 63) * 255 / 63; px[i*4+2] = (p & 31) * 255 / 31; px[i*4+3] = 255;
  }
  tft.putImageData(img, 0, 0);
}
function drawRing() {
  const c = ringC, R = 62, cx = 75, cy = 75; c.clearRect(0, 0, 150, 150);
  for (let i = 0; i < ring.leds; i++) {
    const a = -Math.PI / 2 + i * 2 * Math.PI / ring.leds;
    const x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
    // indicator: LED at pos lit full, neighbours dim (same idea as the real ring renderer)
    let d = Math.abs(((i - ring.pos) % ring.leds + ring.leds) % ring.leds); d = Math.min(d, ring.leds - d);
    const k = ring.enabled ? Math.max(0, 1 - d) * (ring.bright / 255) : 0;
    c.beginPath(); c.arc(x, y, 7, 0, 2 * Math.PI);
    c.fillStyle = `rgba(${ring.r},${ring.g},${ring.b},${0.08 + 0.92 * k})`; c.fill();
    c.strokeStyle = '#333'; c.stroke();
  }
}
function playAudio(buf) {
  const n = (buf.byteLength - 1) / 2; if (n <= 0) return;
  const i16 = new Int16Array(buf.slice(1)); let peak = 0;
  for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(i16[i]));
  $('#vu').value = peak / 32768;
  if (!audioCtx) return;
  const ab = audioCtx.createBuffer(1, n, rate); const ch = ab.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = i16[i] / 32768;
  const src = audioCtx.createBufferSource(); src.buffer = ab; src.connect(audioCtx.destination);
  const now = audioCtx.currentTime; if (playHead < now + 0.02) playHead = now + 0.05;   // small jitter buffer
  src.start(playHead); playHead += n / rate;
}
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`); ws.binaryType = 'arraybuffer';
  ws.onopen = () => $('#status').textContent = 'connected';
  ws.onclose = () => { $('#status').textContent = 'disconnected — retrying'; setTimeout(connect, 1000); };
  ws.onmessage = ev => {
    if (ev.data instanceof ArrayBuffer) { const t = new Uint8Array(ev.data)[0]; if (t === 1) drawFrame(ev.data); else if (t === 2) playAudio(ev.data); return; }
    const m = JSON.parse(ev.data);
    if (m.t === 'serial') log(m.line, m.line.startsWith('SIM:') ? 'sim' : m.line.startsWith('{"type":"event"') ? 'evt' : '');
    else if (m.t === 'ring') { ring = m; drawRing(); }
    else if (m.t === 'board') { rate = m.audioRate || rate; buildButtons(m.buttons); }
  };
}
function buildButtons(list) {
  const host = $('#buttons'); host.querySelectorAll('.pb').forEach(e => e.remove());
  list.forEach((b, i) => {
    const wrap = document.createElement('div'); wrap.className = 'pb cell';
    const el = document.createElement('button'); el.className = 'push ' + (i % 2 ? 'b' : 'g'); el.textContent = 'BTN' + (i + 1);
    const down = v => { el.classList.toggle('down', v); send({t:'btn', pin:b.pin, v: v ? 1 : 0}); };
    el.onmousedown = () => down(true); el.onmouseup = el.onmouseleave = () => down(false);
    el.ontouchstart = e => { e.preventDefault(); down(true); }; el.ontouchend = () => down(false);
    const l = document.createElement('div'); l.className = 'lbl'; l.textContent = b.label + (i === 0 ? ' · play' : i === 1 ? ' · waveform' : '');
    wrap.append(el, l); host.appendChild(wrap);
  });
}
function turn(d) { knobAngle += d * 20; $('#knob .mark').style.transform = `rotate(${knobAngle}deg)`; send({t:'knob', d}); }
$('#knob').addEventListener('wheel', e => { e.preventDefault(); turn(e.deltaY > 0 ? 1 : -1); }, {passive:false});
let dragX = null; $('#knob').onmousedown = e => dragX = e.clientX;
window.onmousemove = e => { if (dragX === null) return; const dx = e.clientX - dragX; if (Math.abs(dx) >= 12) { turn(dx > 0 ? 1 : -1); dragX = e.clientX; } };
window.onmouseup = () => dragX = null;
document.querySelectorAll('.kbtns [data-d]').forEach(b => b.onclick = () => turn(+b.dataset.d));
$('#knobpress').onmousedown = () => send({t:'knobpress', v:1}); $('#knobpress').onmouseup = () => send({t:'knobpress', v:0});
window.onkeydown = e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight') turn(1); if (e.key === 'ArrowLeft') turn(-1); if (e.key === ' ') { e.preventDefault(); send({t:'knobpress', v:1}); } };
window.onkeyup = e => { if (e.key === ' ') send({t:'knobpress', v:0}); };
$('#send').onclick = () => { const l = $('#line').value.trim(); if (!l) return; log('> ' + l, 'in'); send({t:'serial', line:l}); };
$('#line').onkeydown = e => { if (e.key === 'Enter') $('#send').click(); };
$('#clear').onclick = () => con.textContent = '';
$('#audioBtn').onclick = async () => {
  if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)({sampleRate: rate}); }
  await audioCtx.resume(); $('#audioBtn').textContent = '🔊 audio on'; $('#audioBtn').classList.add('on');
};
const presets = [
  ['set_note C', '{"action":"set_note","value":"0"}'], ['set_note A', '{"action":"set_note","value":"5"}'],
  ['octave 5', '{"action":"set_octave","value":"5"}'], ['trigger_note', '{"action":"trigger_note","value":""}'],
  ['chord (3 voices)', '{"action":"play_chord_voices","value":""}'], ['play_note 880', '{"action":"play_note","value":"{\\"frequency\\":880,\\"duration\\":300}"}'],
  ['volume 1.0', '{"action":"set_volume","value":"1.0"}'], ['stop', '{"action":"stop_all_voices","value":""}'],
  ['ring red', '{"action":"set_ring_color","value":"{\\"r\\":255,\\"g\\":0,\\"b\\":40}"}'],
];
presets.forEach(([n, l]) => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = n; b.onclick = () => { $('#line').value = l; $('#send').click(); }; $('#presets').appendChild(b); });
drawRing(); connect();
</script>
</body></html>
