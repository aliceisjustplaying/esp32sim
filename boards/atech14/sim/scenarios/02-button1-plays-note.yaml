name: Left button plays the current note (C4) and reports it
version: 1
author: atech-sim
steps:
  - wait-serial: "FreeRTOS tasks started!"
  - delay: 300ms
  - set-control: { part-id: btn1, control: pressed, value: 1 }
  - wait-serial: "SIM:AUDIO:note=C4"
  - wait-serial: '"event_type":"button","key":"button_press","value":1'
  - wait-serial: '"key":"note_triggered","value":"C4"'
  - set-control: { part-id: btn1, control: pressed, value: 0 }
  - wait-serial: '"key":"button_release","value":0'
