; Atech ESP32-S3 (14-port board) "Pocket Synth" — buildable for Wokwi (sim) and the real board (hw).
;   src/main.cpp        the file generated by the Atech Hardware Platform, unchanged
;   lib/atech_*/        the REAL drivers, synced from the open `atech` SDK (tools/sync-sdk-modules.sh)
;   src/modules/        stand-ins for hosted-platform glue the SDK doesn't ship (AtechSerial, helpers)
;   src/sim/            Wokwi-only shim for the I2S peripheral (not simulated)

[platformio]
default_envs = sim

[env]
platform = espressif32@6.9.0          ; Arduino core 2.0.17 — the API level the Atech SDK targets
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    -Isrc
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1       ; Serial = native USB-Serial/JTAG, same as the SDK's platformio.ini
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit NeoPixel

[env:sim]
build_flags = ${env.build_flags} -DATECH_SIM=1 -include src/sim/sim_i2s_shim.h
build_src_filter = +<*>

[env:hw]
build_src_filter = +<*> -<sim/>
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
